name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and pinned Ruff
        run: pip install -r requirements.txt "ruff==0.16.7"

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: ruff format --check .

      - name: Lint
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: Run tests with coverage
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/roadtrips
          DATABASE_SSLMODE: disable
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=63
