name: Local containers
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ROADTRIPS_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: docker compose --env-file /dev/null -f compose.yaml -p roadtrips-local up --build --detach --wait --wait-timeout 60
      - run: node --test tests/container-smoke.test.mjs
      - name: Test Python in an isolated container
        run: |
          docker build --target test --build-arg VCS_REF="$ROADTRIPS_REVISION" -f backend/Dockerfile -t roadtrips-tests-local .
          docker run --rm --network none -e DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:1/roadtrips -e DATABASE_SSLMODE=disable roadtrips-tests-local
      - name: Require offline authenticated trip creation and reload
        run: |
          npm ci --prefix tests/guidedjourney --ignore-scripts --no-audit --no-fund
          node tests/guidedjourney/run.mjs
      - run: docker compose --env-file /dev/null -f compose.yaml -p roadtrips-local logs --no-color
        if: failure()
      - run: docker compose --env-file /dev/null -f compose.yaml -p roadtrips-local down
        if: always()
