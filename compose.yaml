name: roadtrips-local
services:
  api:
    image: roadtrips-api-local:${ROADTRIPS_REVISION:?Set ROADTRIPS_REVISION}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VCS_REF: ${ROADTRIPS_REVISION:?Set ROADTRIPS_REVISION}
    environment:
      LOCAL_PREVIEW: "true"
      DATABASE_URL: postgresql://fixture:fixture@postgres/roadtrips
      DATABASE_SSLMODE: disable
      MENTRO_GATEWAY_URL: http://mentro-server:3001
      SUPABASE_URL: http://fixture:3004
      SUPABASE_ANON_KEY: local-fixture-anon-key
      CORS_ORIGINS: http://127.0.0.1:8082
    ports: ["127.0.0.1:8002:8000"]
    networks: [isolated, preview]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 768m
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  web:
    image: roadtrips-web-local:${ROADTRIPS_REVISION:?Set ROADTRIPS_REVISION}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VCS_REF: ${ROADTRIPS_REVISION:?Set ROADTRIPS_REVISION}
        VITE_BACKEND_SERVER: http://127.0.0.1:8002/
    ports: ["127.0.0.1:8082:8080"]
    networks: [preview]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 128m
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
networks:
  preview: {}
  isolated:
    internal: true
# Database creation intentionally waits for a reviewed complete schema.
# /health is liveness only; /ready returns 503 until the database is ready.
