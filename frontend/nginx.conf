worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    access_log /dev/stdout;

    # A read-only root filesystem needs only this tmpfs for nginx state.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 = @not_found;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header_inherit merge;

        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok\n";
        }

        location @not_found {
            internal;
            types {}
            default_type text/plain;
            return 404 "not found\n";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Vite gives these generated asset filenames content hashes.
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location ^~ /images/ {
            add_header Cache-Control "public, max-age=300, must-revalidate";
            try_files $uri =404;
        }

        location ^~ /audio/ {
            add_header Cache-Control "public, max-age=300, must-revalidate";
            try_files $uri =404;
        }

        # Public images, audio, PDF and other named files retain real 404s.
        location ~* \.[^/]+$ {
            add_header Cache-Control "public, max-age=300, must-revalidate";
            try_files $uri =404;
        }

        # Only extensionless navigation paths may use the SPA entry point.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
